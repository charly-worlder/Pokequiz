<!--
  Passwort-Reset-Mail (PROJ-1, AC-11 / EC-7).

  Der Link zeigt bewusst NICHT auf den Supabase-Standardpfad, sondern auf unsere
  eigene Route /auth/confirm mit {{ .TokenHash }}. Grund: Der Standard-Link nutzt
  PKCE und braucht den `code_verifier` als Cookie auf dem Gerät, das den Reset
  angefordert hat. Wer die Mail auf einem anderen Gerät öffnet — Anfrage am
  Rechner, Mail am Handy — hat dieses Cookie nicht und kommt nicht weiter (BUG-6).

  Der token_hash ist an das Konto gebunden, nicht an den Browser. Deshalb löst
  /auth/confirm ihn serverseitig per verifyOtp ein und der Link funktioniert
  überall (EC-7).

  Diese Vorlage muss im gehosteten Supabase-Projekt identisch gesetzt werden
  (tasks.md → T18), sonst verschickt die Produktion wieder den Standard-Link.
-->
<h2>Passwort zurücksetzen</h2>

<p>Du hast angefordert, dein Passwort für <strong>Pokémon QUIZ</strong> zurückzusetzen.</p>

<p>
  <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery&next=/reset-password">
    Neues Passwort festlegen
  </a>
</p>

<p>Der Link gilt eine Stunde und kann nur einmal verwendet werden.</p>

<p>Wenn du das nicht warst, kannst du diese E-Mail ignorieren — dein Passwort bleibt unverändert.</p>
